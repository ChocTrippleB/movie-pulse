<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="#0f0d23"/>

  <!-- Clapper body -->
  <rect x="6" y="15" width="20" height="11" rx="1.5" stroke="#a8b5db" stroke-width="1.5" fill="none"/>

  <!-- Clapper top bar -->
  <rect x="6" y="9" width="20" height="6" rx="1" stroke="#a8b5db" stroke-width="1.5" fill="none"/>

  <!-- Diagonal stripes on top bar (clipped to bar bounds) -->
  <defs>
    <clipPath id="bar">
      <rect x="6" y="9" width="20" height="6"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bar)">
    <line x1="4"  y1="15" x2="10" y2="9" stroke="#cecefb" stroke-width="1.5"/>
    <line x1="8"  y1="15" x2="14" y2="9" stroke="#cecefb" stroke-width="1.5"/>
    <line x1="12" y1="15" x2="18" y2="9" stroke="#cecefb" stroke-width="1.5"/>
    <line x1="16" y1="15" x2="22" y2="9" stroke="#cecefb" stroke-width="1.5"/>
    <line x1="20" y1="15" x2="26" y2="9" stroke="#cecefb" stroke-width="1.5"/>
    <line x1="24" y1="15" x2="30" y2="9" stroke="#cecefb" stroke-width="1.5"/>
  </g>

  <!-- Lens/record circle in body -->
  <circle cx="16" cy="21" r="3.2" stroke="#a8b5db" stroke-width="1.2" fill="none"/>
  <circle cx="16" cy="21" r="1.2" fill="#cecefb"/>
</svg>
