<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="#0f0d23"/>

  <!-- Film strip body -->
  <rect x="5" y="12" width="22" height="8" rx="1" stroke="#a8b5db" stroke-width="1.5" fill="none"/>

  <!-- Top sprocket holes -->
  <rect x="7.4"  y="9"    width="2.5" height="2.5" rx="0.5" fill="#a8b5db"/>
  <rect x="14.7" y="9"    width="2.5" height="2.5" rx="0.5" fill="#a8b5db"/>
  <rect x="22.1" y="9"    width="2.5" height="2.5" rx="0.5" fill="#a8b5db"/>

  <!-- Bottom sprocket holes -->
  <rect x="7.4"  y="20.5" width="2.5" height="2.5" rx="0.5" fill="#a8b5db"/>
  <rect x="14.7" y="20.5" width="2.5" height="2.5" rx="0.5" fill="#a8b5db"/>
  <rect x="22.1" y="20.5" width="2.5" height="2.5" rx="0.5" fill="#a8b5db"/>

  <!-- Frame dividers -->
  <line x1="12.3" y1="12" x2="12.3" y2="20" stroke="#a8b5db" stroke-width="1"/>
  <line x1="19.7" y1="12" x2="19.7" y2="20" stroke="#a8b5db" stroke-width="1"/>

  <!-- Center glow dot -->
