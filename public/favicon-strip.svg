  <!-- Small star top-right -->
  <circle cx="25" cy="7" r="2.5" fill="#a8b5db"/>
  <path d="M25 5.2 L25.5 6.5 L26.9 6.5 L25.8 7.3 L26.2 8.7 L25 7.9 L23.8 8.7 L24.2 7.3 L23.1 6.5 L24.5 6.5 Z" fill="#0f0d23"/>
